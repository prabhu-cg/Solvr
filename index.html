<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Solvr — an AI-guided product and UX design workspace. Think through. Design better." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Newsreader:opsz,wght@6..72,500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint so dark mode never flashes light.
      try {
        if (localStorage.getItem('solvr-theme') === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <title>Solvr — Think through. Design better.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
